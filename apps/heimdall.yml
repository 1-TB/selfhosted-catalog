slug: heimdall
name: Heimdall
category: utilities
description: Elegant dashboard to organise links to your web applications.
homepage: https://heimdall.site
source: https://github.com/linuxserver/Heimdall

image: linuxserver/heimdall
version: "2.8.1"
arch: [amd64, arm64]

port: 80
mem_limit: 512m
database: none
auth: proxy

env:
  - name: PUID
    value: "1000"
  - name: PGID
    value: "1000"
  - name: TZ
    value: "Etc/UTC"
  - name: ALLOW_INTERNAL_REQUESTS
    value: "false"

volumes:
  - path: config
    mount: /config

notes: |
  ALLOW_INTERNAL_REQUESTS=false blocks Heimdall's own app tiles from
  pinging services on private IP ranges for live status; set it to true
  if you want status checks against other containers on the same network.
