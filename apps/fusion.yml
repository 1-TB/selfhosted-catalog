slug: fusion
name: Fusion
category: feeds
description: Lightweight RSS/Atom aggregator and reader.
source: https://github.com/0x2E/fusion

image: ghcr.io/0x2e/fusion
version: "1.2.1"
arch: [amd64, arm64]

port: 8080
auth: oidc
redirect_path: /api/oidc/callback

env:
  - name: FUSION_PASSWORD
    secret: true
  - name: FUSION_OIDC_ISSUER
    secret: true
    source: oidc_issuer
  - name: FUSION_OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: FUSION_OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret
  - name: FUSION_OIDC_REDIRECT_URI
    value: "https://fusion.${DOMAIN}/api/oidc/callback"

volumes:
  - path: data
    mount: /data

notes: |
  FUSION_PASSWORD is the fallback single-user password; it's still read even
  when OIDC is configured, so keep it set (and secret) rather than blank.
