slug: crafty-controller
name: Crafty Controller
category: games
description: Web panel for launching and managing Minecraft Java and Bedrock servers.
homepage: https://craftycontrol.com
source: https://gitlab.com/crafty-controller/crafty-4

image: arcadiatechnology/crafty-4
version: "4.10.8"
arch: [amd64, arm64]

port: 8443
mem_limit: 1g
database: none
auth: proxy

env:
  - name: TZ
    value: "Etc/UTC"

volumes:
  - path: backups
    mount: /crafty/backups
  - path: logs
    mount: /crafty/logs
  - path: servers
    mount: /crafty/servers
  - path: config
    mount: /crafty/app/config
  - path: import
    mount: /crafty/import

notes: |
  Runs Minecraft server processes itself (Java/Bedrock binaries), not via
  the Docker socket. Serves the panel over HTTPS with a self-signed cert on
  8443, not plain HTTP - a reverse proxy in front needs to speak HTTPS
  upstream with certificate verification disabled, and forward the
  Upgrade/Connection headers for its websocket console. First run creates
  the admin account interactively in the web UI. Minecraft server ports
  (Java, Bedrock UDP, Dynmap) are opened per-server after creation and
  won't survive a subdomain-only HTTP proxy - they need their own port
  forwards if used.
