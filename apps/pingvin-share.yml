slug: pingvin-share
name: Pingvin Share
category: files
description: Self-hosted file sharing with expiring links.
homepage: https://stonith404.github.io/pingvin-share/
source: https://github.com/stonith404/pingvin-share

image: stonith404/pingvin-share
version: "v1.13"
arch: [amd64, arm64]

port: 3000
mem_limit: 512m
auth: proxy

volumes:
  - path: data
    mount: /opt/app/backend/data
  - path: images
    mount: /opt/app/frontend/public/img
