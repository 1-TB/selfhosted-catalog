slug: medama
name: Medama Analytics
category: monitoring
description: Privacy-first, cookie-free web analytics in a single binary.
homepage: https://medama.io
source: https://github.com/medama-io/medama

image: ghcr.io/medama-io/medama
version: "v0.6.2"
arch: [amd64, arm64]

port: 8080
mem_limit: 512m
database: none
auth: proxy

volumes:
  - path: data
    mount: /app/data

notes: |
  Ships with a default login of admin / CHANGE_ME_ON_FIRST_LOGIN -
  change it on first login. The login form only submits over localhost
  or HTTPS, so it must sit behind a TLS-terminating proxy.
