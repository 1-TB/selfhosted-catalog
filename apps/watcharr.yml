slug: watcharr
name: Watcharr
category: media
description: Track movies, TV shows and more that you've watched or want to.
homepage: https://watcharr.app
source: https://github.com/sbondCo/Watcharr

image: ghcr.io/sbondco/watcharr
version: "v4.2.1"
arch: [amd64, arm64]

port: 3080
mem_limit: 512m
database: none
auth: proxy

volumes:
  - path: data
    mount: /data

notes: |
  The first account created becomes admin with no invite step - keep
  the instance private until you've registered it.
