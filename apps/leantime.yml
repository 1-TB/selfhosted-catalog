slug: leantime
name: Leantime
category: productivity
description: Project management system for small teams, built around goals.
homepage: https://leantime.io
source: https://github.com/Leantime/leantime

image: leantime/leantime
version: "3.9.8"
arch: [amd64, arm64]

port: 8080
mem_limit: 512m
database: mariadb
auth: oidc
redirect_path: /oidc/callback

env:
  - name: LEAN_APP_URL
    value: "https://leantime.${DOMAIN}"
  - name: LEAN_DB_HOST
    value: "leantime-mariadb"
  - name: LEAN_DB_USER
    value: "leantime"
  - name: LEAN_DB_PASSWORD
    value: "${LEANTIME_DB_PASSWORD}"
  - name: LEAN_DB_DATABASE
    value: "leantime"
  - name: LEAN_SESSION_PASSWORD
    secret: true
  - name: LEAN_OIDC_ENABLE
    value: "true"
  - name: LEAN_OIDC_PROVIDER_URL
    value: "https://auth.${DOMAIN}/application/o/leantime/"
  - name: LEAN_OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: LEAN_OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret

volumes:
  - path: userfiles
    mount: /var/www/html/public/userfiles
  - path: plugins
    mount: /var/www/html/app/Plugins
