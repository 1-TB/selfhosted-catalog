slug: linkwarden
name: Linkwarden
category: archiving
description: Bookmark manager that archives pages as it saves them.
homepage: https://linkwarden.app
source: https://github.com/linkwarden/linkwarden

image: ghcr.io/linkwarden/linkwarden
version: "v2.16.0"
arch: [amd64, arm64]

port: 3000
mem_limit: 2g
database: postgres
auth: proxy

env:
  - name: NEXTAUTH_URL
    value: "https://linkwarden.${DOMAIN}/api/v1/auth"
  - name: DATABASE_URL
    value: "postgresql://linkwarden:${LINKWARDEN_DB_PASSWORD}@linkwarden-postgres:5432/linkwarden"
  - name: NEXTAUTH_SECRET
    secret: true

volumes:
  - path: data
    mount: /data/data
