slug: passwordpusher
name: Password Pusher
category: security
description: Share a password or secret via a self-destructing, one-time link.
homepage: https://pwpush.com
source: https://github.com/pglombardo/PasswordPusher

image: pglombardo/pwpush
version: "2.9.7"
arch: [amd64]

port: 5100
health_path: /up
mem_limit: 512m
auth: proxy

env:
  - name: PWP__HOST_DOMAIN
    value: "pwpush.${DOMAIN}"
  - name: PWP__HOST_PROTOCOL
    value: "https"
  - name: SECRET_KEY_BASE
    secret: true
  - name: PWPUSH_MASTER_KEY
    secret: true

volumes:
  - path: data
    mount: /opt/PasswordPusher/storage

notes: |
  amd64-only image. Ships its own login system (no OIDC); set
  PWP__ALLOW_ANONYMOUS=false if accounts should be required. SQLite and
  file storage both live under /opt/PasswordPusher/storage, so it needs
  no separate database.
