slug: patchmon
name: PatchMon
category: monitoring
description: Tracks pending package updates across a fleet of hosts.
homepage: https://patchmon.net
source: https://github.com/PatchMon/PatchMon

image: ghcr.io/patchmon/patchmon-server
version: "2.1.0"
arch: [amd64, arm64]

port: 3000
mem_limit: 1g
database: postgres
needs: [redis, guacd]
auth: oidc
redirect_path: /api/v1/auth/oidc/callback

env:
  - name: CORS_ORIGIN
    value: "https://patchmon.${DOMAIN}"
  - name: TRUST_PROXY
    value: "true"
  - name: POSTGRES_HOST
    value: "patchmon-postgres"
  - name: POSTGRES_USER
    value: "patchmon"
  - name: POSTGRES_DB
    value: "patchmon"
  - name: DATABASE_URL
    value: "postgresql://patchmon:${PATCHMON_DB_PASSWORD}@patchmon-postgres:5432/patchmon"
  - name: REDIS_HOST
    value: "patchmon-redis"
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_DB
    value: "0"
  - name: REDIS_PASSWORD
    secret: true
    source: generated
  - name: JWT_SECRET
    secret: true
    source: generated
  - name: SESSION_SECRET
    secret: true
    source: generated
  - name: AI_ENCRYPTION_KEY
    secret: true
    source: generated
  - name: GUACD_ADDRESS
    value: "patchmon-guacd:4822"
  - name: OIDC_ENABLED
    value: "true"
  - name: OIDC_REDIRECT_URI
    value: "https://patchmon.${DOMAIN}/api/v1/auth/oidc/callback"
  - name: OIDC_SCOPES
    value: "openid email profile groups"
  - name: OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret
  - name: OIDC_ISSUER_URL
    secret: true
    source: oidc_issuer

notes: |
  Three containers plus the database. Redis is not a cache here — it carries
  the Asynq job queue the server runs its scheduled work on — and guacd is a
  hard dependency of the compose file even though it only serves the beta
  in-browser RDP for Windows hosts: upstream gates the server on
  `condition: service_healthy` for both.

  Do not put this one behind a forward-auth proxy. Agents check in outbound to
  `/api/v1` with their own credentials and cannot render a login page, so a
  gate in front of the whole host silently stops every host reporting while
  the UI keeps working. It speaks OIDC itself; OIDC_ISSUER_URL takes the
  issuer with no `.well-known` suffix, and groups arrive in either the `groups`
  or `ak_groups` claim.

  The server holds nothing on disk — agent binaries are baked into the image at
  /app/agents and served read-only, custom logos live in the database — so
  there is no volume to declare and a backup means the Postgres dump.

  Upstream pins postgres:17-alpine. There is no documented health endpoint.

  OIDC_ENABLED=true makes the issuer, client id, secret and redirect URI
  REQUIRED: config.Validate() returns an error and the server exits if any is
  missing, so it crash-loops until the credentials land rather than starting
  with SSO disabled. That is the normal order for an OIDC install here — the
  client does not exist until the app has been registered — but it means the
  first boot is expected to fail, not a sign the deploy went wrong.

  None of the secrets have a length rule, checked against the source rather
  than assumed: JWT_SECRET need only be non-empty, and AI_ENCRYPTION_KEY is
  used as a raw AES-256 key when it is exactly 64 hex characters and SHA-256
  hashed otherwise, so a shorter generated value is fine.
