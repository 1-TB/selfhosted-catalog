slug: handbrake-web
name: HandBrake Web
category: media
description: Self-hosted web interface for headless HandBrake video transcoding.
homepage: https://github.com/TheNickOfTime/handbrake-web
source: https://github.com/TheNickOfTime/handbrake-web

image: ghcr.io/thenickoftime/handbrake-web-server
version: "0.8.1"
arch: [amd64, arm64]

port: 9999
mem_limit: 512m
needs: [worker]
auth: proxy

volumes:
  - path: data
    mount: /data
  - path: media
    mount: /video

notes: |
  Needs at least one handbrake-web-worker container
  (ghcr.io/thenickoftime/handbrake-web-worker, same version tag) -
  the server only coordinates, the worker does the actual encoding via
  HandBrakeCLI. Worker takes WORKER_ID (any unique name), SERVER_URL
  (this container's name) and SERVER_PORT (9999) env vars, and needs
  the same /video mount path as the server so both see the same files.
  No login of its own (planned, not implemented yet), so it needs a
  proxy in front.
