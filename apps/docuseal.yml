slug: docuseal
name: DocuSeal
category: documents
description: Fill and sign documents.
homepage: https://www.docuseal.com
source: https://github.com/docusealco/docuseal

image: docuseal/docuseal
version: "3.1.7"
arch: [amd64, arm64]

port: 3000
mem_limit: 1g
database: postgres
auth: proxy

env:
  - name: DATABASE_URL
    value: "postgresql://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-postgres:5432/docuseal"
  - name: SECRET_KEY_BASE
    secret: true

volumes:
  - path: data
    mount: /data
