slug: olivetin
name: OliveTin
category: automation
description: Turns predefined shell commands into a web button dashboard.
homepage: https://www.olivetin.app
source: https://github.com/OliveTin/OliveTin

image: jamesread/olivetin
version: "3000.18.1"
arch: [amd64, arm64]

port: 1337
mem_limit: 512m
auth: proxy

volumes:
  - path: config
    mount: /config

notes: |
  Everything -- the actions it exposes, local users, OAuth2 login --
  is defined in a config.yaml mounted at /config; there is nothing to
  configure through environment variables. Without a config.yaml the
  container starts with an empty action list.
