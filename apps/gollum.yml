slug: gollum
name: Gollum
category: documents
description: Simple git-backed wiki, editable through its web UI or a plain git clone.
homepage: https://github.com/gollum/gollum
source: https://github.com/gollum/gollum

image: gollumwiki/gollum
version: "6.1"
arch: [amd64, arm64]

port: 4567
mem_limit: 512m
database: none
auth: proxy

volumes:
  - path: data
    mount: /wiki

notes: |
  No env vars and no accounts of its own - pages are just files committed
  to a git repo mounted at /wiki, editable through the web UI or a normal
  git clone. That repo must be `git init`'d before the first run or the
  container has nothing to serve.
