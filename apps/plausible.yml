slug: plausible
name: Plausible Analytics
category: monitoring
description: Privacy-friendly web analytics, an alternative to Google Analytics.
homepage: https://plausible.io
source: https://github.com/plausible/community-edition

image: ghcr.io/plausible/community-edition
version: "v3.2.1"
arch: [amd64, arm64]

port: 8000
mem_limit: 512m
database: postgres
needs: [clickhouse]
auth: proxy

env:
  - name: BASE_URL
    value: "https://plausible.${DOMAIN}"
  - name: SECRET_KEY_BASE
    secret: true
  - name: DATABASE_URL
    value: "postgres://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible-postgres:5432/plausible_db"
  - name: CLICKHOUSE_DATABASE_URL
    value: "http://plausible-clickhouse:8123/plausible_events_db"

notes: |
  Needs a ClickHouse container alongside Postgres for the events
  database - not a single-container install. SECRET_KEY_BASE must be at
  least 64 bytes. Upstream's own compose.yml instead binds host ports
  80/443 with a bundled reverse-proxy flow for automatic Let's Encrypt;
  this entry uses HTTP_PORT's default of 8000 behind your own proxy
  instead.
