slug: adguardhome
name: AdGuard Home
category: network
description: Network-wide DNS filtering.
homepage: https://adguard.com/adguard-home.html
source: https://github.com/AdguardTeam/AdGuardHome

image: adguard/adguardhome
version: "v0.108.0-b.1"
arch: [amd64, arm64]

port: 3000
mem_limit: 512m
auth: proxy

volumes:
  - path: work
    mount: /opt/adguardhome/work
  - path: conf
    mount: /opt/adguardhome/conf

notes: |
  Answering DNS needs port 53 on the host, which a HTTP-only proxy
  cannot carry. The admin UI is the part on 3000.
