slug: pdfding
name: PdfDing
category: documents
description: Minimal, fast PDF manager, viewer and editor.
homepage: https://pdfding.com
source: https://github.com/mrmn2/PdfDing

image: mrmn/pdfding
version: "v1.12.0"
arch: [amd64, arm64]

port: 8000
mem_limit: 512m
database: none
auth: proxy

env:
  - name: HOST_NAME
    value: "pdfding.${DOMAIN}"
  - name: SECRET_KEY
    secret: true

volumes:
  - path: db
    mount: /home/nonroot/pdfding/db
  - path: media
    mount: /home/nonroot/pdfding/media

notes: |
  Ships its own username/password login; also supports native OIDC SSO
  (OIDC_ENABLE and related OIDC_* vars) if you'd rather skip the proxy,
  but the docs don't publish an exact callback path so it isn't modeled
  as auth: oidc here. Defaults to SQLite under db/; no external database
  needed.
