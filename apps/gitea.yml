slug: gitea
name: Gitea
category: developer
description: Lightweight git forge.
homepage: https://about.gitea.com
source: https://github.com/go-gitea/gitea

image: gitea/gitea
version: "1.27.1"
arch: [amd64, arm64]

port: 3000
mem_limit: 1g
database: postgres
auth: oidc
redirect_path: /user/oauth2/authentik/callback

env:
  - name: GITEA__database__DB_TYPE
    value: "postgres"
  - name: GITEA__database__HOST
    value: "gitea-postgres:5432"
  - name: GITEA__database__NAME
    value: "gitea"
  - name: GITEA__database__USER
    value: "gitea"
  - name: GITEA__database__PASSWD
    value: "${GITEA_DB_PASSWORD}"
  - name: GITEA__server__ROOT_URL
    value: "https://gitea.${DOMAIN}/"

volumes:
  - path: data
    mount: /data
