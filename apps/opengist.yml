slug: opengist
name: Opengist
category: developer
description: Self-hosted pastebin backed by git.
homepage: https://opengist.io
source: https://github.com/thomiceli/opengist

image: ghcr.io/thomiceli/opengist
version: "1.15.1"
arch: [amd64, arm64]

port: 6157
mem_limit: 256m
auth: oidc
redirect_path: /oauth/openid-connect/callback

env:
  - name: OG_EXTERNAL_URL
    value: "https://gist.${DOMAIN}"
  - name: OG_OIDC_PROVIDER_NAME
    value: "Authentik"
  - name: OG_OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: OG_OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret
  - name: OG_OIDC_DISCOVERY_URL
    secret: true
    source: oidc_discovery_url

volumes:
  - path: data
    mount: /opengist
