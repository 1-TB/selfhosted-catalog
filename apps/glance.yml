slug: glance
name: Glance
category: utilities
description: Dashboard that puts feeds, and widgets on one page.
homepage: https://github.com/glanceapp/glance
source: https://github.com/glanceapp/glance

image: glanceapp/glance
version: "v0.8.5"
arch: [amd64, arm64]

port: 8080
mem_limit: 256m
auth: proxy

volumes:
  - path: config
    mount: /app/config
