slug: feedpushr
name: Feedpushr
category: feeds
description: RSS/Atom stream router and aggregator with pluggable output filters.
homepage: https://github.com/ncarlier/feedpushr
source: https://github.com/ncarlier/feedpushr

image: ncarlier/feedpushr
version: "3.4.1"
arch: [amd64, arm64]

port: 8080
mem_limit: 512m
database: none
auth: proxy

volumes:
  - path: data
    mount: /var/opt/feedpushr

notes: |
  Web UI is at /ui. Ships with no auth by default; FP_AUTHN can point to an
  htpasswd file for basic auth, or an OIDC issuer URL for OIDC login, but the
  OIDC path doesn't document a client id/secret or callback route, so this
  entry sticks with a reverse-proxy in front rather than guessing at it.
  Uses an embedded BoltDB by default (FP_DB), no external database needed.
