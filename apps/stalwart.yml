slug: stalwart
name: Stalwart
category: communication
description: Mail server with JMAP, IMAP and SMTP in one binary.
homepage: https://stalw.art
source: https://github.com/stalwartlabs/stalwart

image: stalwartlabs/stalwart
version: "v0.16.16"
arch: [amd64, arm64]

port: 8080
mem_limit: 1g
auth: none

volumes:
  - path: etc
    mount: /opt/stalwart/etc
  - path: data
    mount: /opt/stalwart/data

notes: |
  Mail ports (25, 465, 587, 993, 4190) have to reach the host
  directly; only the admin UI works through a HTTP proxy.
