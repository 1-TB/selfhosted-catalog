slug: kavita
name: Kavita
category: media
description: Reading server for comics, manga and ebooks.
homepage: https://www.kavitareader.com
source: https://github.com/Kareadita/Kavita

image: jvmilazz0/kavita
version: "0.9.0"
arch: [amd64, arm64]

port: 5000
mem_limit: 1g
auth: proxy

volumes:
  - path: config
    mount: /kavita/config
  - path: library
    mount: /library
