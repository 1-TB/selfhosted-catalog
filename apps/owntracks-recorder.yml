slug: owntracks-recorder
name: OwnTracks Recorder
category: productivity
description: Stores and serves the location history published by the OwnTracks mobile app.
homepage: https://owntracks.org
source: https://github.com/owntracks/recorder

image: owntracks/recorder
version: "1.0.1"
arch: [amd64, arm64]

port: 8083
mem_limit: 512m
auth: proxy

env:
  - name: OTR_HTTPHOST
    value: "0.0.0.0"
  - name: OTR_PORT
    value: "0"

volumes:
  - path: store
    mount: /var/spool/owntracks/recorder/store

notes: |
  OTR_HTTPHOST must be set to 0.0.0.0 - it defaults to localhost, which
  is unreachable from outside the container. OTR_PORT=0 disables the
  optional MQTT listener so this runs as a single container accepting
  the app's HTTP-mode publishes directly; upstream's own docs say they
  don't recommend HTTP mode because it makes configuring the "Friends"
  feature harder, but the core recording/viewing function works fine.
  Has no login of its own - the web UI shows every device's history to
  anyone who reaches it, so it must sit behind an authenticating proxy.
