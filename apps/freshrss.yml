slug: freshrss
name: FreshRSS
category: feeds
description: Feed aggregator with a large extension ecosystem.
homepage: https://freshrss.org
source: https://github.com/FreshRSS/FreshRSS

image: freshrss/freshrss
version: "1.29.1"
arch: [amd64, arm64]

port: 80
mem_limit: 512m
database: postgres
auth: proxy

env:
  - name: TZ
    value: "UTC"
  - name: CRON_MIN
    value: "*/20"

volumes:
  - path: data
    mount: /var/www/FreshRSS/data
  - path: extensions
    mount: /var/www/FreshRSS/extensions
