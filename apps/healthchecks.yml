slug: healthchecks
name: Healthchecks
category: monitoring
description: Cron job and heartbeat monitoring that alerts when a check misses.
homepage: https://healthchecks.io
source: https://github.com/healthchecks/healthchecks

image: healthchecks/healthchecks
version: "v4.3"
arch: [amd64, arm64]

port: 8000
mem_limit: 512m
database: none
auth: proxy

env:
  - name: SECRET_KEY
    secret: true
  - name: ALLOWED_HOSTS
    value: "healthchecks.${DOMAIN}"
  - name: SITE_ROOT
    value: "https://healthchecks.${DOMAIN}"
  - name: DB
    value: "sqlite"
  - name: DB_NAME
    value: "/data/hc.sqlite"

volumes:
  - path: data
    mount: /data

notes: |
  Runs on the bundled SQLite database, so no separate database
  container is needed. Email, Slack, webhook and other notification
  channels each need their own env vars (EMAIL_HOST and friends) --
  add them per the self-hosting docs for whichever channels are used.
