slug: libretranslate
name: LibreTranslate
category: utilities
description: Machine translation API and web UI.
homepage: https://libretranslate.com
source: https://github.com/LibreTranslate/LibreTranslate

image: libretranslate/libretranslate
version: "v1.9.6"
arch: [amd64, arm64]

port: 5000
mem_limit: 2g
auth: proxy

volumes:
  - path: models
    mount: /home/libretranslate/.local

notes: |
  Downloads language models on first run, which takes a while and a
  few GB depending on how many languages are enabled.
