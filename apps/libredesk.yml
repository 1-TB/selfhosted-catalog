slug: libredesk
name: Libredesk
category: productivity
description: Open-source, self-hosted omnichannel customer support desk.
homepage: https://libredesk.io
source: https://github.com/abhinavxd/libredesk

image: libredesk/libredesk
version: "v2.6.1"
arch: [amd64, arm64]

port: 9000
mem_limit: 512m
database: postgres
needs: [redis]
auth: proxy

env:
  - name: LIBREDESK_SYSTEM_USER_PASSWORD
    secret: true

volumes:
  - path: uploads
    mount: /libredesk/uploads

notes: |
  Also needs a config.toml mounted at /libredesk/config.toml with the
  Postgres/Redis connection settings and a 32-char encryption key
  (openssl rand -hex 16) - upstream's own docker-compose.yml bind-mounts
  this file rather than driving those settings from env vars; see
  config.sample.toml in the repo. The app container runs an install/
  upgrade routine on every start (`--install --idempotent-install --yes`
  then `--upgrade --yes`), which is expected. Supports OIDC/Google/
  Microsoft SSO from the admin settings UI, but the exact callback path
  isn't published in the docs, so this entry uses proxy auth instead; if
  the live-chat widget is enabled it's meant to be reached by anonymous
  visitors, so don't gate the whole app behind a blanket auth proxy.
