slug: seerr
name: Seerr
category: media
description: Request and discovery manager for Jellyfin, Plex and Emby libraries, the unified successor to Overseerr and Jellyseerr.
homepage: https://seerr.dev
source: https://github.com/seerr-team/seerr

image: ghcr.io/seerr-team/seerr
version: "v3.4.1"
arch: [amd64, arm64]

port: 5055
mem_limit: 1g
database: none
auth: proxy

env:
  - name: TZ
    value: "Etc/UTC"

volumes:
  - path: config
    mount: /app/config

notes: |
  Overseerr and Jellyseerr merged into this project in 2026; both
  predecessors are now unmaintained. Uses SQLite under /app/config by
  default (DB_TYPE=postgres is available for an external database).
  On first start it auto-imports an existing Overseerr/Jellyseerr config
  from the same volume if present.
