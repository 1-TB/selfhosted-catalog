slug: romm
name: RomM
category: games
description: Scans a ROM library and enriches it with box art and metadata.
homepage: https://romm.app
source: https://github.com/rommapp/romm

image: rommapp/romm
version: "5.1.0"
arch: [amd64, arm64]

port: 8080
mem_limit: 1g
database: mariadb
needs: [redis]
auth: oidc
redirect_path: /api/oauth/openid

env:
  - name: ROMM_BASE_URL
    value: "https://romm.${DOMAIN}"
  - name: ROMM_AUTH_SECRET_KEY
    secret: true
  - name: DB_HOST
    value: "romm-mariadb"
  - name: DB_NAME
    value: "romm"
  - name: DB_USER
    value: "romm"
  - name: DB_PASSWD
    value: "${ROMM_DB_PASSWORD}"
  - name: REDIS_HOST
    value: "romm-redis"
  - name: OIDC_ENABLED
    value: "true"
  - name: OIDC_PROVIDER
    value: "authentik"
  - name: OIDC_REDIRECT_URI
    value: "https://romm.${DOMAIN}/api/oauth/openid"
  - name: OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret
  - name: OIDC_SERVER_APPLICATION_URL
    secret: true
    source: oidc_issuer

volumes:
  - path: library
    mount: /romm/library
  - path: resources
    mount: /romm/resources
  - path: assets
    mount: /romm/assets
  - path: config
    mount: /romm/config

notes: |
  Needs a MariaDB database and Redis; not a single-container install.
  OIDC_SERVER_APPLICATION_URL is the identity provider's base URL, not
  a discovery document, and OIDC_REDIRECT_URI must match exactly what
  is registered at the provider (scheme, host and path, no trailing
  slash).
