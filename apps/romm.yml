slug: romm
name: RomM
category: games
description: Web-based ROM library manager with metadata scraping.
homepage: https://romm.app
source: https://github.com/rommapp/romm

image: rommapp/romm
version: "5.1"
arch: [amd64, arm64]

port: 8080
mem_limit: 512m
database: mariadb
auth: oidc
redirect_path: /api/oauth/openid

env:
  - name: ROMM_BASE_URL
    value: "https://romm.${DOMAIN}"
  - name: DB_HOST
    value: "romm-mariadb"
  - name: DB_USER
    value: "romm"
  - name: DB_PASSWD
    value: "${ROMM_DB_PASSWORD}"
  - name: ROMM_AUTH_SECRET_KEY
    secret: true
  - name: OIDC_ENABLED
    value: "true"
  - name: OIDC_CLIENT_ID
    secret: true
    source: oidc_client_id
  - name: OIDC_CLIENT_SECRET
    secret: true
    source: oidc_client_secret
  - name: OIDC_SERVER_METADATA_URL
    secret: true
    source: oidc_discovery_url
  - name: OIDC_REDIRECT_URI
    value: "https://romm.${DOMAIN}/api/oauth/openid"

volumes:
  - path: library
    mount: /romm/library
  - path: resources
    mount: /romm/resources
  - path: assets
    mount: /romm/assets
  - path: config
    mount: /romm/config

notes: |
  Metadata scraping (cover art, descriptions) needs at least one of a
  ScreenScraper, IGDB, RetroAchievements or SteamGridDB API key set
  separately - the library still works without one, just with no
  match data.
