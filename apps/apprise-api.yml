slug: apprise-api
name: Apprise API
category: communication
description: REST API and web UI for sending notifications to 100+ services.
homepage: https://github.com/caronc/apprise-api
source: https://github.com/caronc/apprise-api

image: caronc/apprise
version: "1.5.1"
arch: [amd64, arm64]

port: 8000
mem_limit: 512m
database: none
auth: proxy

env:
  - name: APPRISE_STATEFUL_MODE
    value: "simple"

volumes:
  - path: config
    mount: /config
  - path: attach
    mount: /attach

notes: |
  No login of its own - anyone who can reach it can read stored
  notification URLs and send messages, so keep it behind the fronting
  proxy's auth. APPRISE_STATEFUL_MODE=simple stores one config per key
  instead of the default hash-keyed lookup.
