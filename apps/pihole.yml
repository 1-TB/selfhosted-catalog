slug: pihole
name: Pi-hole
category: network
description: Network-wide DNS sinkhole for blocking ads and trackers.
homepage: https://pi-hole.net
source: https://github.com/pi-hole/pi-hole

image: pihole/pihole
version: "v5.8.1"
arch: [amd64, arm64]

port: 80
mem_limit: 512m
auth: proxy

env:
  - name: TZ
    value: "Etc/UTC"
  - name: FTLCONF_webserver_api_password
    secret: true
  - name: FTLCONF_dns_listeningMode
    value: "ALL"

volumes:
  - path: etc-pihole
    mount: /etc/pihole

notes: |
  Answering DNS needs port 53 tcp/udp on the host, which an HTTP-only
  proxy cannot carry; only the admin UI on 80 goes through the proxy.
  Also wants the NET_ADMIN and SYS_NICE capabilities for DHCP/ARP
  features, which this schema has no field for.
