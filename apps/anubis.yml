slug: anubis
name: Anubis
category: security
description: Proof-of-work gate that keeps scraper bots off an upstream.
homepage: https://anubis.techaro.lol
source: https://github.com/TecharoHQ/anubis

image: ghcr.io/techarohq/anubis
version: "v1.17.1"
arch: [amd64, arm64]

port: 8923
mem_limit: 256m
auth: none

notes: |
  Sits in front of another service rather than being browsed itself.
  Point TARGET at the upstream you want protected.
