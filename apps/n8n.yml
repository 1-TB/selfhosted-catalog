slug: n8n
name: n8n
category: automation
description: Workflow automation with a node editor.
homepage: https://n8n.io
source: https://github.com/n8n-io/n8n

image: n8nio/n8n
version: "1.114.4"
arch: [amd64, arm64]

port: 5678
mem_limit: 2g
database: postgres
auth: proxy

env:
  - name: N8N_HOST
    value: "n8n.${DOMAIN}"
  - name: WEBHOOK_URL
    value: "https://n8n.${DOMAIN}/"
  - name: DB_TYPE
    value: "postgresdb"
  - name: DB_POSTGRESDB_HOST
    value: "n8n-postgres"
  - name: DB_POSTGRESDB_DATABASE
    value: "n8n"
  - name: DB_POSTGRESDB_USER
    value: "n8n"
  - name: DB_POSTGRESDB_PASSWORD
    value: "${N8N_DB_PASSWORD}"
  - name: N8N_ENCRYPTION_KEY
    secret: true

volumes:
  - path: data
    mount: /home/node/.n8n
