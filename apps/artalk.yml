slug: artalk
name: Artalk
category: communication
description: Self-hosted comment system with an admin dashboard, embeddable on any site.
homepage: https://artalk.js.org
source: https://github.com/ArtalkJS/Artalk

image: artalk/artalk-go
version: "2.10.0"
arch: [amd64, arm64]

port: 23366
mem_limit: 512m
database: none
auth: none

env:
  - name: ATK_SITE_URL
    value: "https://artalk.${DOMAIN}"
  - name: ATK_SITE_DEFAULT
    value: "Artalk"
  - name: ATK_TRUSTED_DOMAINS
    value: "${DOMAIN}"
  - name: ATK_APP_KEY
    secret: true
  - name: ATK_ADMIN_USERS_0_PASSWORD
    secret: true

volumes:
  - path: data
    mount: /data

notes: |
  Uses an embedded SQLite database at /data/artalk.db by default (also
  supports MySQL/Postgres via ATK_DB_TYPE if you'd rather point it at an
  external database). Public comment posting has no login by design - it's
  meant to be embedded on other sites - but the admin dashboard is
  protected by ATK_ADMIN_USERS_0_PASSWORD (a bcrypt hash, see the docs for
  how to generate one).
