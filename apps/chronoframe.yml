slug: chronoframe
name: ChronoFrame
category: media
description: Personal photo and video gallery with Live Photo support, map-based exploration and AI-assisted search.
homepage: https://github.com/HoshinoSuzumi/chronoframe
source: https://github.com/HoshinoSuzumi/chronoframe

image: ghcr.io/hoshinosuzumi/chronoframe
version: "0.14.1"
arch: [amd64, arm64]

port: 3000
mem_limit: 512m
database: none
auth: proxy

env:
  - name: CFRAME_ADMIN_EMAIL
    value: "admin@${DOMAIN}"
  - name: CFRAME_ADMIN_PASSWORD
    secret: true
  - name: NUXT_SESSION_PASSWORD
    secret: true
  - name: NUXT_STORAGE_PROVIDER
    value: local

volumes:
  - path: data
    mount: /app/data

notes: |
  Storage defaults to S3; NUXT_STORAGE_PROVIDER=local keeps photos on
  the mounted volume instead (under data/storage). NUXT_SESSION_PASSWORD
  must be exactly 32 characters. GitHub OAuth login exists
  (NUXT_OAUTH_GITHUB_*) but is off by default and isn't general-purpose
  OIDC - the built-in admin email/password login is the default path in.
