slug: wiki-go
name: Wiki-Go
category: documents
description: Databaseless flat-file wiki with versioning, comments and Kanban boards.
homepage: https://leomoon.com/downloads/web-apps/wiki-go/
source: https://github.com/leomoon-studios/wiki-go

image: leomoonstudios/wiki-go
version: "1.8.12"
arch: [amd64, arm64]

port: 8080
mem_limit: 512m
auth: proxy

volumes:
  - path: data
    mount: /wiki/data

notes: |
  No database and no env vars - everything (including the site URL) is
  set through data/config.yaml, seeded on first run with default login
  admin/admin. Own local-account login only, no OIDC. Set
  allow_insecure_cookies: true in the config if running without TLS.
